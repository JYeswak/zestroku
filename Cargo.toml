[workspace]
resolver = "2"
members = ["crates/zestroku-types", "crates/zestroku-proto", "crates/zestroku-core", "crates/zestroku-api", "crates/zestroku-mcp", "crates/zestroku-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
quick-xml = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
