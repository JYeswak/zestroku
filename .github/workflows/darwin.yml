name: darwin

# Native Mach-O arm64 build on a GitHub macOS runner (zestroku-build-darwin-l6d).
# The rch workers are Linux: this is the reproducible route to a macOS binary
# without the zig cross toolchain, and it runs the workspace tests natively on
# macOS. Manual only; it is not a merge gate.
on:
  workflow_dispatch:
    inputs:
      old_ref:
        description: >-
          Optional real saved revision (commit/tag) of an OLDER source. When
          set, it is built under its own identity and the installer consumer
          scenario runs old -> new (scripts/test-install-macos.sh, 1r4.9).
        required: false
        default: ""
      diag_test:
        description: >-
          Optional zestroku-cli integration-test binary name (letters, digits,
          underscores). When set, ONLY a diagnostic job runs: that one binary
          with --nocapture so failure messages and captured request traces
          are not truncated by any checker (.11.3 regression evidence).
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 3
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  build:
    runs-on: macos-14
    if: ${{ inputs.diag_test == '' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned nightly (matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
          cache-on-failure: true

      - name: build release binary
        env:
          ZESTROKU_BUILD_SHA: ${{ github.sha }}
          ZESTROKU_BUILD_DIRTY: "false"
        # Stock toolchain: portable default (2oz.1) needs no --config overrides.
        run: cargo build --release --locked -p zestroku-cli

      - name: identify the binary
        run: |
          file target/release/zestroku
          shasum -a 256 target/release/zestroku
          target/release/zestroku --version

      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: zestroku-aarch64-apple-darwin
          path: target/release/zestroku
          if-no-files-found: error

      - name: keep the new build for the installer scenario
        if: ${{ inputs.old_ref != '' }}
        run: cp target/release/zestroku "$RUNNER_TEMP/zestroku-new"

      - name: checkout the old revision (a real saved source, not a relabel)
        if: ${{ inputs.old_ref != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.old_ref }}
          path: old-src

      - name: build the old revision under its own identity
        if: ${{ inputs.old_ref != '' }}
        working-directory: old-src
        env:
          ZESTROKU_BUILD_DIRTY: "false"
        # The old revision may still carry the cross-build linker config that
        # 2oz.1 removed; the clang overrides make it build on a stock runner.
        run: |
          ZESTROKU_BUILD_SHA="$(git rev-parse HEAD)" cargo \
            --config 'env.CC_aarch64_apple_darwin.value="clang"' \
            --config 'env.CC_aarch64_apple_darwin.relative=false' \
            --config 'env.CC_aarch64_apple_darwin.force=true' \
            --config 'target.aarch64-apple-darwin.linker="clang"' \
            build --release --locked -p zestroku-cli
          file target/release/zestroku
          target/release/zestroku --version

      - name: installer consumer scenario (old revision -> new revision)
        if: ${{ inputs.old_ref != '' }}
        env:
          TMPDIR: ${{ runner.temp }}/scenario
        run: |
          mkdir -p "$TMPDIR"
          sh scripts/test-install-macos.sh old-src/target/release/zestroku "$RUNNER_TEMP/zestroku-new"

      - name: retain both exact executables with source, version and digest
        if: ${{ always() && inputs.old_ref != '' }}
        run: |
          cp old-src/target/release/zestroku "$RUNNER_TEMP/zestroku-old"
          {
            echo "new_source=${{ github.sha }}"
            echo "old_source=$(git -C old-src rev-parse HEAD)"
            shasum -a 256 "$RUNNER_TEMP/zestroku-old" "$RUNNER_TEMP/zestroku-new"
            echo "old: $("$RUNNER_TEMP/zestroku-old" --version)"
            echo "new: $("$RUNNER_TEMP/zestroku-new" --version)"
          } > "$RUNNER_TEMP/scenario-manifest.txt"
          cat "$RUNNER_TEMP/scenario-manifest.txt"

      - name: upload both executables, manifest and per-command scenario evidence
        if: ${{ always() && inputs.old_ref != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: installer-scenario
          path: |
            ${{ runner.temp }}/zestroku-old
            ${{ runner.temp }}/zestroku-new
            ${{ runner.temp }}/scenario-manifest.txt
            ${{ runner.temp }}/scenario/zestroku-install.*/evidence
          if-no-files-found: error

      - name: test (offline, native macOS)
        run: cargo test --workspace

  diag:
    runs-on: macos-14
    if: ${{ inputs.diag_test != '' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned nightly (matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
          cache-on-failure: true

      - name: one test binary with captured output
        env:
          DIAG_TEST: ${{ inputs.diag_test }}
        run: |
          case "$DIAG_TEST" in
            ''|*[!A-Za-z0-9_]*) echo "diag_test must be a test binary name" >&2; exit 2 ;;
          esac
          cargo test --locked -p zestroku-cli --test "$DIAG_TEST" -- --nocapture --test-threads=1
