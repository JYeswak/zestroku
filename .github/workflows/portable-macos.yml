name: portable-macos

# Portability gate (zestroku-2oz.1): a stock macOS checkout builds and tests
# with NO --config overrides and WITHOUT the fleet zigcc shim. The Linux ->
# darwin cross config is opt-in env (see README "Build and run"), never a
# committed default, so this job fails if the shim wiring returns to
# .cargo/config.toml.
on:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 3
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  stock-macos:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Fleet shim must be absent
        run: test ! -e /usr/local/bin/zigcc-aarch64-darwin

      - name: Install pinned nightly (matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
          cache-on-failure: true

      - name: Set up pinned Bun for mission checks
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.3"

      - name: build (stock, no --config overrides)
        run: cargo build --locked -p zestroku-cli

      - name: Mission check with stock local Cargo
        id: mission_check
        shell: bash
        run: |
          cargo_path="$(command -v cargo)"
          bun_path="$(command -v bun)"
          cargo_bin="${cargo_path%/*}"
          bun_bin="${bun_path%/*}"
          export PATH="${cargo_bin}:${bun_bin}:/usr/bin:/bin:/usr/sbin:/sbin"
          test "$(command -v cargo)" = "$cargo_path"
          test "$(command -v bun)" = "$bun_path"
          printf 'cargo=%s\nbun=%s\n' "$cargo_path" "$bun_path"
          test "$(bun --version)" = "1.4.3"
          if command -v rch >/dev/null 2>&1 || command -v omp-kit >/dev/null 2>&1; then
            printf 'RCH and omp-kit must be absent from the mission-check PATH\n' >&2
            exit 1
          fi
          unset RCH_REQUIRE_REMOTE ZESTROKU_MISSION_RUN_RCH
          bun scripts/mission-check.ts --pillar safe-control

      - name: test (stock, no --config overrides)
        # Keep the full workspace test observable when mission registration is UNKNOWN.
        if: ${{ success() || steps.mission_check.outcome == 'failure' }}
        run: cargo test --locked --workspace
        timeout-minutes: 60
