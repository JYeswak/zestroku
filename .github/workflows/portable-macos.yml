name: portable-macos

# Portability gate (zestroku-2oz.1): a stock macOS checkout builds and tests
# with NO --config overrides and WITHOUT the fleet zigcc shim. The Linux ->
# darwin cross config is opt-in env (see README "Build and run"), never a
# committed default, so this job fails if the shim wiring returns to
# .cargo/config.toml.
on:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 3
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  ZESTROKU_BUILD_SHA: ${{ github.sha }}
  ZESTROKU_BUILD_DIRTY: "false"

jobs:
  stock-macos:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Fleet shim must be absent
        run: test ! -e /usr/local/bin/zigcc-aarch64-darwin

      - name: Install pinned nightly (matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
          cache-on-failure: true

      - name: build (stock, no --config overrides)
        run: cargo build --locked -p zestroku-cli

      - name: Portable CLI smoke (simulated, not a mission verdict)
        id: portable_smoke
        shell: bash
        run: |
          cargo_path="$(command -v cargo)"
          cargo_bin="${cargo_path%/*}"
          export PATH="${cargo_bin}:/usr/bin:/bin:/usr/sbin:/sbin"
          test "$(command -v cargo)" = "$cargo_path"
          printf 'cargo=%s\n' "$cargo_path"
          binary="$PWD/target/debug/zestroku"
          test -x "$binary"
          if command -v rch >/dev/null 2>&1 || command -v omp-kit >/dev/null 2>&1; then
            printf 'RCH and omp-kit must be absent from the portable smoke PATH\n' >&2
            exit 1
          fi
          "$binary" sim --scenario two-devices --json

      - name: test (stock, no --config overrides)
        # Keep all workspace tests observable after a failed application smoke.
        if: ${{ success() || steps.portable_smoke.outcome == 'failure' }}
        run: cargo test --locked --workspace
        timeout-minutes: 60
