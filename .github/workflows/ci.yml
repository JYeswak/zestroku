name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      plant_owned_tmpdir_guard:
        description: >-
          Manual negative control for 2oz.3: reinstate the old
          /var/agent-tmp/ guard in the checked-out mission test (never
          committed) and run ONLY the mission-tests job, which must fail.
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # GH free runners: 4 vCPU / 7 GB. The franken stack (fsqlite + fastmcp +
  # fastapi + asupersync) OOM-killed at -j default: rustc processes were
  # SIGTERM'd mid-compile (exit 143) on both cold runs. -j 2 caps parallel
  # rustc memory; CARGO_NET_GIT_FETCH_WITH_CLI avoids libgit2 flakiness on
  # the git deps. This mirrors the rch fleet discipline (-j 2 everywhere).
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  gates:
    if: ${{ !inputs.plant_owned_tmpdir_guard }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned nightly (matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-31
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          # cache the git-dep check artifacts too (fastmcp/fastapi are git revs)
          workspaces: |
            .
          cache-on-failure: true

      # ── Gate battery (repo AGENTS.md test discipline; offline legs only) ──
      - name: fmt
        run: cargo fmt --check --all

      - name: check
        run: cargo check --locked --workspace --all-targets
        timeout-minutes: 75

      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
        timeout-minutes: 75

      - name: test (offline; live-LAN legs are --ignored by design)
        run: cargo test --locked --workspace
        timeout-minutes: 60

      # ── Franken-stack invariant: ONE asupersync version in the graph ──
      - name: one asupersync (Cx type universe)
        run: |
          cargo tree --locked -i asupersync --workspace | tee /tmp/asup-tree.txt
          versions=$(grep -c '^asupersync v' /tmp/asup-tree.txt || true)
          test "$versions" -le 1 || { echo "::error::asupersync version fork — Cx is not one type"; exit 1; }

      # ── No tokio/reqwest re-entrenchment (scaffold-drift guard) ──
      - name: no tokio or reqwest in workspace manifests
        run: |
          if grep -rn '^\(tokio\|reqwest\)' Cargo.toml crates/*/Cargo.toml; then
            echo "::error::tokio/reqwest are banned; the franken stack is the wiring (plan §3)"
            exit 1
          fi

      # ── Identifier scrub gate: serial/UDN/MAC/ad-id shapes never land ──
      - name: identifier scrub (plan ZP:58-59)
        run: bash scripts/check-identifiers.sh

  # Mission checker TypeScript tests on a stock runner (2oz.3). A separate job
  # so a Rust gate failure cannot hide it (and vice versa): default TMPDIR, no
  # owned-scratch guard, so the suite must not depend on the fleet's
  # var/agent-tmp layout. Same pinned Bun as portable-macos.
  mission-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned Bun for mission tests
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.3"

      - name: plant the old owned-TMPDIR guard (manual negative control only)
        if: ${{ inputs.plant_owned_tmpdir_guard }}
        run: |
          printf '%s\n' \
            'const scratchRoot = process.env.TMPDIR;' \
            'if (!scratchRoot || !scratchRoot.includes("/var/agent-tmp/")) {' \
            '  throw new Error("Tests require owned repo var/agent-tmp TMPDIR");' \
            '}' > planted-guard.ts
          cat planted-guard.ts scripts/mission-check.test.ts > planted.test.ts
          mv planted.test.ts scripts/mission-check.test.ts
          head -n 6 scripts/mission-check.test.ts

      - name: mission tests (bun test scripts/, default TMPDIR)
        run: |
          echo "TMPDIR=${TMPDIR:-<unset: platform default>}"
          bun test scripts/
        timeout-minutes: 15
